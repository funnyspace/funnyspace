name: BillNest Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'billnest/android/**'
      - '.github/workflows/billnest-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android installable test APK
        working-directory: billnest/android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Prepare named APK
        run: cp billnest/android/app/build/outputs/apk/debug/app-debug.apk BillNest-Android-Test.apk
      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: BillNest-Android-APK
          path: BillNest-Android-Test.apk
          if-no-files-found: error
          retention-days: 30
